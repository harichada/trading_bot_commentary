backtesting:
  commission: 0.005
  enabled: true
  end_date: '2024-01-01'
  initial_capital: 100000
  slippage: 0.001
  start_date: '2023-01-01'
commentary:
  detail_level: verbose
  enabled: true
  max_history: 100
error_recovery:
  circuit_breaker_enabled: true
  emergency_stop_loss: 0.15
  max_daily_loss_threshold: 0.1
  max_retries: 3
  retry_delay: 1.0
order_management:
  auto_cancel_existing_orders: true
  confirm_only_losses: false
  confirm_threshold_percent: 5
  require_close_confirmation: true
paths:
  backtest_results: backtest_results.json
  commentary_log: trading_commentary.json
  log: trading_bot.log
  model: trading_model.pkl
  trade_journal: trade_journal.json
performance_metrics:
  calculate_max_drawdown: true
  calculate_sharpe: true
  calculate_sortino: true
  risk_free_rate: 0.02
schwab:
  callback_url: https://127.0.0.1
  token_path: token_1.json
technical_analysis:
  fibonacci_levels:
  - 0.236
  - 0.382
  - 0.5
  - 0.618
  - 0.786
  timeframes:
  - 1min
  - 5min
  - 15min
  - 1hour
  - 1day
trading:
  max_consecutive_losses: 3
  max_daily_loss: 0.05
  max_position_value: 10000
  max_positions: 5
  max_risk_per_trade: 0.02
  min_buying_power: 100
  min_position_size: 1
  min_risk_reward_ratio: 2.0
  ml_prediction_enabled: false
  position_size_kelly_fraction: 0.25
  reserve_cash_percent: 0.1
