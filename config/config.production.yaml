# Production Environment Configuration
# =====================================
# This file contains production-specific settings.
# NEVER commit secrets to this file - use environment variables.

database:
  host: "${DATABASE_HOST:-localhost}"
  port: 5432
  database: trading_prod
  user: "${DATABASE_USER:-trading}"
  pool_size: 20
  ssl_enabled: true

api:
  schwab_app_key: "${SCHWAB_APP_KEY}"
  schwab_callback_url: "https://trading.yourdomain.com/callback"
  schwab_token_path: "/secure/tokens/token_prod.json"
  rate_limit_per_second: 5
  timeout_seconds: 30.0
  max_retries: 3

trading:
  max_positions: 10
  max_position_value: 50000.0
  max_portfolio_percent: 0.15
  max_daily_loss_percent: 0.02
  max_daily_loss_absolute: 5000.0
  max_drawdown_percent: 0.10
  default_stop_loss_percent: 0.02
  default_take_profit_percent: 0.04
  min_position_value: 500.0
  use_paper_trading: false

risk:
  var_confidence_level: 0.99
  var_lookback_days: 252
  correlation_threshold: 0.75
  max_sector_exposure: 0.25
  max_single_stock_exposure: 0.08
  circuit_breaker_loss_threshold: 0.025
  consecutive_loss_limit: 4

ml:
  model_path: "/models/production/"
  feature_store_path: "/data/feature_store/"
  retrain_threshold_days: 3
  min_training_samples: 2000
  prediction_confidence_threshold: 0.65
  enable_online_learning: true
  drift_detection_enabled: true
  drift_threshold: 0.08

alerting:
  enabled: true
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  email_smtp_host: "smtp.gmail.com"
  email_smtp_port: 587
  email_from: "${ALERT_EMAIL_FROM}"
  email_to:
    - "${ALERT_EMAIL_PRIMARY}"
    - "${ALERT_EMAIL_BACKUP}"
  throttle_minutes: 3
  escalation_minutes: 15

logging:
  level: "INFO"
  format: "json"
  log_file: "/var/log/trading/trading_bot.log"
  max_file_size_mb: 200
  backup_count: 10
  include_timestamps: true
  mask_sensitive_data: true

feature_flags:
  enable_new_strategies: false
  enable_ml_v2: false
  enable_advanced_orders: true
  close_positions_on_shutdown: true
  enable_performance_profiling: false
