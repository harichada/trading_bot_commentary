version: '3.8'

services:
  trading-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: trading-bot
    restart: unless-stopped
    ports:
      - "${API_PORT:-9000}:9000"
    environment:
      - TRADING_MODE=${TRADING_MODE:-simulation}
      - API_PORT=9000
      - SCHWAB_API_KEY=${SCHWAB_API_KEY:-}
      - SCHWAB_API_SECRET=${SCHWAB_API_SECRET:-}
      - SCHWAB_ACCOUNT_ID=${SCHWAB_ACCOUNT_ID:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - trading-data:/app/data
      - trading-logs:/app/logs
      - ./config:/app/config:ro
      # Mount token file for authentication (if using live trading)
      - ${TOKEN_PATH:-./token_1.json}:/app/token_1.json:ro
    networks:
      - trading-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Settings UI service
  settings-ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ui
    container_name: trading-settings-ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-8001}:8001"
    environment:
      - BOT_PORT=9000
      - UI_PORT=8001
    depends_on:
      - trading-bot
    networks:
      - trading-network

  # Optional: Redis for caching (future use)
  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - trading-network
    profiles:
      - with-cache

  # Optional: PostgreSQL for trade history (future use)
  postgres:
    image: postgres:15-alpine
    container_name: trading-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=trading
      - POSTGRES_USER=trading
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - trading-network
    profiles:
      - with-db

networks:
  trading-network:
    driver: bridge

volumes:
  trading-data:
  trading-logs:
  redis-data:
  postgres-data:
