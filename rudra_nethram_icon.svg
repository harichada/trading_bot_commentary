<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="eyeGlow" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0a0a0f" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fireGrad" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#c23616"/>
      <stop offset="40%" stop-color="#e94560"/>
      <stop offset="70%" stop-color="#ff6b2b"/>
      <stop offset="100%" stop-color="#f5c842"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="50%" stop-color="#d4a456"/>
      <stop offset="100%" stop-color="#8a6914"/>
    </linearGradient>
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#00e5ff"/>
      <stop offset="70%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0277bd"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a456"/>
      <stop offset="50%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#8a6914"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <linearGradient id="moonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e0d4"/>
      <stop offset="100%" stop-color="#b8c6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.6"/>
  <circle cx="256" cy="256" r="235" fill="none" stroke="url(#ringGrad)" stroke-width="0.5" opacity="0.3"/>

  <!-- Sacred dots -->
  <g opacity="0.3">
    <circle cx="256" cy="20" r="3" fill="#d4a456"/>
    <circle cx="256" cy="492" r="3" fill="#d4a456"/>
    <circle cx="20" cy="256" r="3" fill="#d4a456"/>
    <circle cx="492" cy="256" r="3" fill="#d4a456"/>
    <circle cx="89" cy="89" r="2.5" fill="#d4a456"/>
    <circle cx="423" cy="89" r="2.5" fill="#d4a456"/>
    <circle cx="89" cy="423" r="2.5" fill="#d4a456"/>
    <circle cx="423" cy="423" r="2.5" fill="#d4a456"/>
  </g>

  <!-- Eye ambient glow -->
  <circle cx="256" cy="210" r="120" fill="url(#eyeGlow)"/>

  <!-- Flames -->
  <g opacity="0.85">
    <path d="M256,60 Q248,100 240,140 Q252,110 256,80 Q260,110 272,140 Q264,100 256,60Z" fill="url(#fireGrad)" opacity="0.9"/>
    <path d="M220,105 Q215,130 210,155 Q222,135 228,120 Q225,140 235,160 Q230,130 220,105Z" fill="url(#fireGrad)" opacity="0.7"/>
    <path d="M292,105 Q297,130 302,155 Q290,135 284,120 Q287,140 277,160 Q282,130 292,105Z" fill="url(#fireGrad)" opacity="0.7"/>
    <path d="M198,130 Q195,148 194,165 Q202,150 206,140 Q204,155 210,168 Q206,145 198,130Z" fill="url(#fireGrad)" opacity="0.5"/>
    <path d="M314,130 Q317,148 318,165 Q310,150 306,140 Q308,155 302,168 Q306,145 314,130Z" fill="url(#fireGrad)" opacity="0.5"/>
  </g>

  <!-- The Third Eye -->
  <path d="M160,210 Q208,155 256,150 Q304,155 352,210 Q304,265 256,270 Q208,265 160,210Z" fill="#0d1117" stroke="url(#ringGrad)" stroke-width="2.5"/>
  <path d="M172,210 Q214,163 256,158 Q298,163 340,210 Q298,257 256,262 Q214,257 172,210Z" fill="#0d1a2a"/>
  <circle cx="256" cy="210" r="42" fill="#0a2a4a"/>
  <circle cx="256" cy="210" r="36" fill="url(#irisGrad)" opacity="0.9"/>
  <circle cx="256" cy="210" r="16" fill="#0a0a0f"/>
  <circle cx="256" cy="210" r="10" fill="#050510"/>
  <circle cx="248" cy="202" r="6" fill="rgba(255,255,255,0.7)"/>
  <circle cx="264" cy="216" r="3" fill="rgba(255,255,255,0.3)"/>

  <!-- Iris detail lines -->
  <g stroke="#00e5ff" stroke-width="0.5" opacity="0.4">
    <line x1="256" y1="174" x2="256" y2="194"/>
    <line x1="256" y1="226" x2="256" y2="246"/>
    <line x1="220" y1="210" x2="240" y2="210"/>
    <line x1="272" y1="210" x2="292" y2="210"/>
    <line x1="230" y1="184" x2="244" y2="198"/>
    <line x1="268" y1="222" x2="282" y2="236"/>
    <line x1="282" y1="184" x2="268" y2="198"/>
    <line x1="244" y1="222" x2="230" y2="236"/>
  </g>

  <!-- Crescent Moon -->
  <g transform="translate(340, 130) rotate(25)">
    <path d="M0,-28 A28,28 0 1,1 0,28 A20,20 0 1,0 0,-28Z" fill="url(#moonGrad)" opacity="0.85"/>
  </g>

  <!-- Trishul -->
  <line x1="256" y1="290" x2="256" y2="450" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
  <line x1="256" y1="270" x2="256" y2="310" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M228,283 Q222,272 218,290" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M284,283 Q290,272 294,290" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M218,310 Q237,318 256,320 Q275,318 294,310" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Snake -->
  <path d="M248,350 Q235,340 240,330 Q248,322 256,330 Q264,340 272,335 Q280,328 274,320 Q265,315 256,322" fill="none" stroke="#4a6a5a" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Sacred Bindu -->
  <circle cx="256" cy="460" r="5" fill="url(#goldGrad)" opacity="0.6"/>

  <!-- Sacred side dots -->
  <g opacity="0.2" fill="#d4a456">
    <circle cx="130" cy="256" r="1.5"/><circle cx="382" cy="256" r="1.5"/>
    <circle cx="140" cy="300" r="1"/><circle cx="372" cy="300" r="1"/>
    <circle cx="145" cy="340" r="1"/><circle cx="367" cy="340" r="1"/>
  </g>
</svg>
